# Зеркало Netlify на GitHub Pages: та же сборка (npm run build:all), тот же
# platform/dist. Сайт живёт под подпутём /concepts/, поэтому все ссылки
# в сборке относительные.
name: Pages

on:
  push:
    # portfolio-quality — пока main ждёт проверки, сайт публикуется с ветки
    branches: [main, portfolio-quality]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: platform/package-lock.json
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      - run: npm run build:all
      # Без этого Pages прогоняет сайт через Jekyll и превращает доки .md в HTML
      - run: touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: platform/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

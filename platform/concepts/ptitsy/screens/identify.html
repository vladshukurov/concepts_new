<div class="screen ios-surface" id="scr-identify" style="background:#ecece8">
  <div class="pt-dim"></div>
  <div class="pt-sheet">
    <div class="pt-handle"></div>
    <div class="pt-sheet-title">
      <h1>Определить птицу</h1>
      <button class="icon-btn tap" data-back aria-label="Закрыть"><svg class="ico-svg"><use href="#i-x"/></svg></button>
    </div>

    <button class="pt-method tap" data-ask="camera|camera|identify">
      <span class="lead-ico brand"><svg class="ico-svg"><use href="#i-camera"/></svg></span>
      <div><b>Навести камеру</b><small>Держите птицу в кадре 2–3 секунды</small></div>
      <span class="ios-disclosure"></span>
    </button>
    <button class="pt-method tap" data-ask="photo|photos|identify">
      <span class="lead-ico green"><svg class="ico-svg"><use href="#i-images"/></svg></span>
      <div><b>Выбрать снимок</b><small>Чем крупнее птица в кадре, тем точнее</small></div>
      <span class="ios-disclosure"></span>
    </button>
    <button class="pt-method tap" data-jump="library">
      <span class="lead-ico gray"><svg class="ico-svg"><use href="#i-book-open"/></svg></span>
      <div><b>Искать по признакам</b><small>Размер, место, голос</small></div>
      <span class="ios-disclosure"></span>
    </button>

    <div class="perm-hidden ui-denied" data-show-denied="camera"><svg><use href="#i-camera"/></svg><strong>Нет доступа к камере</strong><span>Разрешите доступ в Настройках</span><button class="ui-denied-btn" data-toast="Откроются Настройки iOS">Открыть Настройки</button></div>
    
  </div>
  <div class="home-ind"></div>
</div>

<div class="screen st-camera" id="scr-camera">
  <div class="navbar on-dark">
    <div class="nav-leading">
      <div class="btn-plain on-dark tap" data-back>Отмена</div>
    </div>
    <div class="title">Сканирование</div>
    <div class="nav-trailing">
      <div
        class="icon-btn on-dark tap"
        data-go="settings"
        aria-label="Настройки камеры"
      >
        <svg class="ico-svg"><use href="#i-settings" /></svg>
      </div>
    </div>
  </div>
  <div class="st-camera-view">
    <div class="st-camera-media st-sprite st-scores st-q2"></div>
    <div class="st-camera-shade"></div>
    <div class="st-camera-frame"></div>
    <div class="st-camera-hint">Держите страницу внутри рамки</div>
    <div class="st-camera-thumb st-sprite st-scores st-q1"></div>
    <div
      class="st-shutter tap"
      data-primary
      data-go="sheet"
      aria-label="Снять страницу"
    ><span>Снять страницу</span></div>
    <div class="st-camera-count">2 страницы</div>
    <div class="perm-hidden ui-denied" data-show-denied="camera"><svg><use href="#i-camera"/></svg><strong>Нет доступа к камере</strong><span>Разрешите доступ в Настройках</span><button class="ui-denied-btn" data-toast="Откроются Настройки iOS">Открыть Настройки</button></div>
  </div>
  <div class="home-ind"></div>
</div>

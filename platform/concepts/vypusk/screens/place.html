<div class="screen r-page" id="scr-place">
  <div class="sheet">
    <div class="grabber" aria-hidden="true"></div>
    <div class="sheet-body flush">
      <div class="r-top"><div class="r-top-title">Место съёмки</div><div class="r-top-acts"><div class="r-icon tap" data-back aria-label="Закрыть"><svg class="ico-svg"><use href="#i-x"/></svg></div></div></div>
      <div class="searchfield">Поиск по названию</div>
      <div class="r-card">
        <div class="r-row tap" data-go="chronicleadd" aria-label="Отметить Школа № 57, Казань">
          <div class="r-row-face"><svg class="ico-svg"><use href="#i-map-pin"/></svg></div>
          <div class="r-row-copy"><div class="r-row-t">Школа № 57, Казань</div><div class="r-row-s">120 м · здесь учился 11 «Б»</div></div>
        </div>
        <div class="r-row tap" data-go="chronicleadd" aria-label="Отметить улицу Садовая">
          <div class="r-row-face"><svg class="ico-svg"><use href="#i-map-pin"/></svg></div>
          <div class="r-row-copy"><div class="r-row-t">Школьный двор</div><div class="r-row-s">340 м · место с фото последнего звонка</div></div>
        </div>
        <div class="r-row tap" data-go="chronicleadd" aria-label="Отметить Чудское озеро">
          <div class="r-row-face"><svg class="ico-svg"><use href="#i-map-pin"/></svg></div>
          <div class="r-row-copy"><div class="r-row-t">Кафе «Выпускник»</div><div class="r-row-s">2,7 км</div></div>
        </div>
        <div class="r-row tap" data-toast="Ввести адрес вручную" aria-label="Вписать своё место">
          <div class="r-row-face"><svg class="ico-svg"><use href="#i-plus"/></svg></div>
          <div class="r-row-copy"><div class="r-row-t">Вписать своё</div><div class="r-row-s">для мест, которых нет на карте</div></div>
        </div>
      </div>
      <div class="perm-hidden ui-denied" data-show-denied="location"><svg><use href="#i-map-pin"/></svg><strong>Нет доступа к геопозиции</strong><span>Разрешите доступ в Настройках</span><button class="ui-denied-btn" data-toast="Откроются Настройки iOS">Открыть Настройки</button></div>
    </div>
    <div class="sheet-footer">
      <button class="btn-filled tap" data-primary data-go="chronicleadd" aria-label="Отметить место">Отметить</button>
    </div>
  </div>
</div>

<div class="screen pc-page" id="scr-record">
  <div class="pc-camera-top">
    <button class="pc-close tap" data-back aria-label="Закрыть">
      <svg class="ico-svg"><use href="#i-x" /></svg>
    </button>
    <div><span>«РОСА» · ПОНТОН C</span><strong>Бортовая запись</strong></div>
    <button
      class="pc-help tap"
      data-toast="Снимите место, которое нужно проверить следующему выходу"
      aria-label="Помощь"
    >
      ?
    </button>
  </div>
  <div class="pc-view ph on-dark">
    <div class="pc-frame"><span>ПОМПА</span><i></i><b>наведите на узел</b></div>
  </div>
  <div class="pc-meter">
    <span>ЗВУК</span><i></i><i></i><i></i><i></i><i></i><i></i><i></i
    ><b>−18 dB</b>
  </div>
  <div class="pc-capture-copy">
    <strong>Трюмная помпа</strong
    ><span>Следующему выходу · сегодня в 21:15</span>
  </div>
  <div class="perm-hidden ui-denied" data-show-denied="camera,mic"><svg><use href="#i-camera"/></svg><strong>Нет доступа к камере</strong><span>Разрешите доступ в Настройках</span><button class="ui-denied-btn" data-toast="Откроются Настройки iOS">Открыть Настройки</button></div>
  <button
    class="pc-shutter tap"
    data-primary
    data-ask="camera+mic|logged|record"
  >
    <span></span><b>Снять 20 секунд</b>
  </button>
  <div class="home-ind" aria-hidden="true"></div>
</div>

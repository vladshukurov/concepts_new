<div class="screen r-page r-dark" id="scr-shoot">
  <div class="cam">
    <div class="cam-preview ph on-dark"></div>
    <div class="cam-top">
      <div class="icon-btn tap" data-back aria-label="Закрыть камеру"><svg class="ico-svg"><use href="#i-x"/></svg></div>
      <div class="cam-mid">Фото</div>
      <div class="cam-trailing">
        <div class="icon-btn tap" data-toast="Вспышка · авто" aria-label="Вспышка"><svg class="ico-svg"><use href="#i-zap"/></svg></div>
      </div>
    </div>
    <div class="cam-bottom">
      <div class="ios-segmented">
        <button class="seg is-on tap" aria-label="Режим фото">Фото</button>
        <button class="seg tap" data-toast="Видео пишется со звуком — нужен микрофон" aria-label="Режим видео">Видео</button>
      </div>
      <div class="cam-controls">
        <div class="cam-slot">
          <div class="cam-thumb ph on-dark tap" data-go="picker" aria-label="Открыть медиатеку"></div>
        </div>
        <button class="cam-shutter tap" data-primary data-go="compose" aria-label="Снять"><span class="r-sr-only">Снять</span></button>
        <div class="cam-slot">
          <div class="icon-btn tap" data-toast="Камера · фронтальная" aria-label="Переключить камеру"><svg class="ico-svg"><use href="#i-rotate-cw"/></svg></div>
        </div>
      </div>
    </div>
    <div class="perm-hidden ui-denied" data-show-denied="camera"><svg><use href="#i-camera"/></svg><strong>Нет доступа к камере</strong><span>Разрешите доступ в Настройках</span><button class="ui-denied-btn" data-toast="Откроются Настройки iOS">Открыть Настройки</button></div>
  </div>
</div>

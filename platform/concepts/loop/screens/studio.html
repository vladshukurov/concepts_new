<div class="screen cx-screen" id="scr-studio">
<div class="cx-scroll">
<header class="lp-top">
<div>
<small>КОНСТРУКТОР</small>
<h1>Студия</h1>
</div>
<button data-go="profile" class="lp-avatar" aria-label="Профиль">В</button>
</header>
<section class="lp-studio-lead">
<div>
<small>НОВЫЙ РЕМИКС</small>
<h2>Соберите трек из лупов</h2>
<p>Темп и тональность подстроятся автоматически.</p>
<button class="cx-primary" data-go="player">
<svg>
<use href="#i-plus"/>
</svg>
<span>Начать микс</span>
</button>
</div>
<div class="lp-stack-art">
<div class="cx-art art-1">
</div>
<div class="cx-art art-2">
</div>
<div class="cx-art art-3">
</div>
</div>
</section>
<div class="cx-section">
<h2>Добавить свой материал</h2>
</div>
<div class="lp-create-list">
<button data-ask="camera+mic|capture|studio">
<span class="lp-icon pink">
<svg>
<use href="#i-camera"/>
</svg>
</span>
<div>
<strong>Снять и записать</strong>
<small>Камера + микрофон</small>
</div>
<svg>
<use href="#i-chevron-right"/>
</svg>
</button>
<div class="perm-hidden ui-denied" data-show-denied="camera"><svg><use href="#i-camera"/></svg><strong>Нет доступа к камере</strong><span>Разрешите доступ в Настройках</span><button class="ui-denied-btn" data-toast="Откроются Настройки iOS">Открыть Настройки</button></div>
<div class="perm-hidden ui-denied" data-show-denied="mic"><svg><use href="#i-mic"/></svg><strong>Нет доступа к микрофону</strong><span>Разрешите доступ в Настройках</span><button class="ui-denied-btn" data-toast="Откроются Настройки iOS">Открыть Настройки</button></div>
<button data-ask="photo|pick|studio">
<span class="lp-icon violet">
<svg>
<use href="#i-image"/>
</svg>
</span>
<div>
<strong>Выбрать обложку</strong>
<small>Только один снимок из «Фото»</small>
</div>
<svg>
<use href="#i-chevron-right"/>
</svg>
</button>

<button data-ask="mic|capture|studio">
<span class="lp-icon amber">
<svg>
<use href="#i-mic"/>
</svg>
</span>
<div>
<strong>Записать без камеры</strong>
<small>До 16 секунд · на устройстве</small>
</div>
<svg>
<use href="#i-chevron-right"/>
</svg>
</button>
</div>
<button class="cx-link" data-go="denied">Как работают доступы</button>
</div>
<nav class="cx-tabs">
<button data-go="home">
<svg>
<use href="#i-house"/>
</svg>
<span>Главная</span>
</button>
<button data-go="discover">
<svg>
<use href="#i-search"/>
</svg>
<span>Поиск</span>
</button>
<button data-go="studio" class="make on">
<svg>
<use href="#i-plus"/>
</svg>
<span>Студия</span>
</button>
<button data-go="library">
<svg>
<use href="#i-bookmark"/>
</svg>
<span>Моя</span>
</button>
<button data-go="profile">
<svg>
<use href="#i-user"/>
</svg>
<span>Профиль</span>
</button>
</nav>
<div class="home-ind">
</div>
</div>
